<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Querida compañera Jade</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #4A90E2,
        #5DADE2,
        #85C1E9
    );
    transition:1s;
}

.container{
    text-align:center;
    padding:30px;
    z-index:2;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:20px;
    text-shadow:2px 2px 10px rgba(0,0,0,.15);
}

p{
    color:white;
    font-size:1.2rem;
    margin-bottom:30px;
}

button{
    border:none;
    border-radius:15px;
    padding:15px 30px;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
}

#yes{
    background:white;
    color:#4A90E2;
    font-weight:bold;
}

#yes:hover{
    transform:scale(1.08);
}

#no{
    background:white;
    color:#4A90E2;
}

.buttons{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

#message{
    margin-top:25px;
    color:white;
    font-size:22px;
    font-weight:bold;
    min-height:30px;
}

#finalScreen{
    display:none;
    text-align:center;
    color:white;
    z-index:2;
}
    

#finalScreen h1{
    font-size:3.5rem;
    margin-bottom:20px;
}

#finalScreen h2{
    margin:15px;
}

#countdown{
    margin-top:25px;
    font-size:1.4rem;
    font-weight:bold;
}

.heart{
    position:absolute;
    font-size:25px;
    pointer-events:none;
    animation:floatUp linear forwards;
}

@keyframes floatUp{

    from{
        transform:translateY(0);
        opacity:1;
    }

    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container" id="main">

    <h1>Hola compañera Jade</h1>

    <p>
        Oyeee te quería preguntar algo...
    </p>

    <h1 style="font-size:2.5rem;">
        ¿Te gustaría salir conmigo?
    </h1>

    <br>

    <div class="buttons">

        <button id="yes">
            Claro que Sí
        </button>

        <button id="no">
            No
        </button>

    </div>

    <div id="message"></div>

</div>

<div id="finalScreen">

    <h1>Sabía que dirías que sí jajaja</h1>

    <h2>
        Gracias por aceptar, te prometo que será increíble
    </h2>

    <h2>
        Sábado 20
    </h2>

    <h2>
        Ubicación: Sorpresaaa
    </h2>

    <h2>
        Prepárate para un gran día
    </h2>

    <div id="countdown"></div>

    <h2 style="margin-top:40px;">
        No olvides adjuntar tus evidencias jajaja
    </h2>

    <button id="shareBtn"
    style="
    background:white;
    color:#ff69b4;
    font-weight:bold;
    margin-top:15px;
    ">
        Compartir evidencias
    </button>


</div>

<script>

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const message = document.getElementById("message");

window.onload = () => {

    noBtn.style.position = "relative";
    noBtn.style.left = "0";
    noBtn.style.top = "0";

};

let escala = 1;

const frases = [
    "¿Segurísima?",
    "Error... Inténtalo de nuevo",
    "Prometo que será divertido",
    "Vamos, di que sí",
    "Será un gran día",
    "Por favooooooor",
    "Neta di que sí"
];

let intento = 0;

function moverBoton(){

    noBtn.style.position = "absolute";

    const ancho = window.innerWidth - 150;
    const alto = window.innerHeight - 80;

    const x = Math.random() * ancho;
    const y = Math.random() * alto;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    message.innerHTML =
        frases[Math.min(intento, frases.length - 1)];

    intento++;

    escala += 0.15;

    yesBtn.style.transform =
        `scale(${escala})`;
}

noBtn.addEventListener("mouseover", moverBoton);
noBtn.addEventListener("click", moverBoton);

yesBtn.addEventListener("click", () => {

    document.getElementById("main").style.display = "none";
    document.getElementById("finalScreen").style.display = "block";

    document.body.style.background =
    "linear-gradient(135deg,#ffb6c1,#ffc0cb,#ffd1dc)";

    iniciarCuentaRegresiva();
    iniciarCorazones();

    for(let i=0; i<150; i++){

        setTimeout(() => {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            heart.innerHTML =
                Math.random() > 0.5 ? "❤️" : "💙";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.top =
                "100vh";

            heart.style.animationDuration =
                (Math.random()*4 + 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            },7000);

        },i*30);

    }

});

function iniciarCuentaRegresiva(){

    const fechaCita =
        new Date("2026-06-20T18:00:00");

    const countdown =
        document.getElementById("countdown");

    setInterval(() => {

        const ahora = new Date();

        const diferencia =
            fechaCita - ahora;

        if(diferencia <= 0){

            countdown.innerHTML =
                "🎉 ¡Hoy es el gran día! 🎉";

            return;
        }

        const dias =
            Math.floor(
                diferencia /
                (1000*60*60*24)
            );

        const horas =
            Math.floor(
                (diferencia %
                (1000*60*60*24))
                /
                (1000*60*60)
            );

        const minutos =
            Math.floor(
                (diferencia %
                (1000*60*60))
                /
                (1000*60)
            );

        const segundos =
            Math.floor(
                (diferencia %
                (1000*60))
                /
                1000
            );

        countdown.innerHTML =
            `Faltan ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos`;

    },1000);
}

function iniciarCorazones(){

    setInterval(() => {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            Math.random() > 0.5 ? "❤️" : "💙";

        heart.style.left =
            Math.random()*100 + "vw";

        heart.style.top = "100vh";

        heart.style.animationDuration =
            (Math.random()*4 + 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        },8000);

    },250);
}
    document.addEventListener("click", async (e) => {

    if(e.target.id !== "shareBtn") return;

    try {

document.addEventListener("click", async (e) => {

    if(e.target.id !== "shareBtn") return;

    try {

        const evidenciaCanvas =
            document.createElement("canvas");

        evidenciaCanvas.width = 1080;
        evidenciaCanvas.height = 1350;

        const ctx =
            evidenciaCanvas.getContext("2d");

        const gradiente =
            ctx.createLinearGradient(
                0,0,
                1080,1350
            );

        gradiente.addColorStop(0,"#ffffff");
        gradiente.addColorStop(1,"#ffe4f1");

        ctx.fillStyle = gradiente;
        ctx.fillRect(
            0,
            0,
            evidenciaCanvas.width,
            evidenciaCanvas.height
        );

        ctx.fillStyle = "#ff69b4";
        ctx.textAlign = "center";

        ctx.font = "bold 80px Arial";

        ctx.fillText(
            "Sí quiero salir contigo ❤️",
            540,
            250
        );

        ctx.font = "50px Arial";

        ctx.fillText(
            "Jade ha aceptado la invitación",
            540,
            380
        );

        const textoCuenta =
            document.getElementById(
                "countdown"
            ).innerText;

        ctx.font = "bold 55px Arial";

        const lineas = [];

        let palabras =
            textoCuenta.split(" ");

        let linea = "";

        for(let palabra of palabras){

            let prueba =
                linea + palabra + " ";

            if(
                ctx.measureText(prueba)
                .width > 900
            ){

                lineas.push(linea);
                linea =
                    palabra + " ";

            }else{

                linea = prueba;

            }

        }

        lineas.push(linea);

        let y = 650;

        lineas.forEach(l => {

            ctx.fillText(
                l,
                540,
                y
            );

            y += 80;

        });

        ctx.font = "45px Arial";

        ctx.fillText(
            "📅 Sábado 20",
            540,
            950
        );

        ctx.fillText(
            "📍 Ubicación: Sorpresaaa",
            540,
            1030
        );

        ctx.fillText(
            "✨ Evidencia oficial ✨",
            540,
            1180
        );

        evidenciaCanvas.toBlob(
            async (blob) => {

                const file =
                    new File(
                        [blob],
                        "confirmacion.png",
                        {
                            type:
                            "image/png"
                        }
                    );

                if(
                    navigator.canShare &&
                    navigator.canShare({
                        files:[file]
                    })
                ){

                    await navigator.share({
                        title:
                        "Confirmación",
                        text:
                        "Sí quiero salir contigo ❤️",
                        files:[file]
                    });

                } else {

                    alert(
                    "Tu navegador no permite compartir imágenes."
                    );

                }

            },
            "image/png"
        );

    } catch(error) {

        console.error(error);

    }

});

</script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
